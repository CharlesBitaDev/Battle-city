name: Build TV app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the game code
        run: |
          npm install --no-save --no-package-lock acorn@8
          node tools/check.mjs

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-34" > /dev/null

      - name: Build the APK
        run: VERSION_CODE=$((100 + GITHUB_RUN_NUMBER)) ./build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: battle-city-apk
          path: build/battle-city.apk

      # Keeps one download link that always points at the newest build:
      # https://github.com/<owner>/<repo>/releases/download/latest/battle-city.apk
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/battle-city.apk \
            --target "$GITHUB_SHA" \
            --title "Battle City (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}, build $((100 + GITHUB_RUN_NUMBER)). Install battle-city.apk on the TV."
